<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow AI - ToDoozie & Task Assistant</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border: #334155;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        header {
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px 0;
            font-size: 1.8rem;
            color: #818cf8;
        }

        header p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* ToDoozie Section */
        .timer-display {
            font-size: 4.5rem;
            font-weight: 800;
            text-align: center;
            letter-spacing: -2px;
            margin: 10px 0;
            font-variant-numeric: tabular-nums;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button.secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        button.secondary:hover {
            background-color: var(--border);
        }

        /* Music Generator Control Panel */
        .music-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .music-controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        select {
            background-color: var(--bg-color);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        select:focus {
            border-color: var(--accent);
        }

        /* Tasks Section */
        .task-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .task-title {
            font-weight: 500;
        }

        .task-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .status-not-started { background-color: rgba(148, 163, 184, 0.1); color: var(--text-secondary); border-color: var(--border); }
        .status-in-progress { background-color: rgba(245, 158, 11, 0.15); color: var(--warning); border-color: rgba(245, 158, 11, 0.3); }
        .status-done { background-color: rgba(16, 185, 129, 0.15); color: var(--success); border-color: rgba(16, 185, 129, 0.3); text-decoration: line-through; }

        .subtasks {
            list-style: disc;
            margin: 4px 0 0 20px;
            padding: 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        #ai-status {
            background-color: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>FocusFlow AI</h1>
            <p>ToDoozie Focus Timer & In-Browser AI Task Breakdown</p>
        </header>

        <!-- ToDoozie Timer Card with Continuous Drone Soundscape -->
        <div class="card" style="text-align: center;">
            <div id="timer-mode" style="text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; color: var(--text-secondary);">Work Session</div>
            <div class="timer-display" id="timer">25:00</div>
            <div class="timer-controls">
                <button id="start-btn" onclick="toggleTimer()">Start</button>
                <button class="secondary" onclick="resetTimer()">Reset</button>
                <button class="secondary" onclick="switchMode()">Switch Mode</button>
            </div>

            <!-- Continuous Ambient Soundscape Panel -->
            <div class="music-panel">
                <div style="font-size: 0.85rem; font-weight: 600; color: #a5b4fc; text-align: left;">🎵 Continuous Ambient Soundscape</div>
                <div class="music-controls-row">
                    <select id="music-style-select" onchange="changeMusicStyle()">
                        <option value="lofi">☕ Lo-Fi Warm Pad (Smooth Chords)</option>
                        <option value="synthwave">🌆 Synthwave Space (Floating Drones)</option>
                        <option value="ambient">🌌 Deep Theta Zen (Infinite Waves)</option>
                    </select>
                    <button id="music-toggle-btn" class="secondary" onclick="toggleMusic()">Play Soundscape</button>
                </div>
            </div>
        </div>

        <!-- AI Status banner -->
        <div id="ai-status">Initializing local AI model...</div>

        <!-- Tasks Card -->
        <div class="card">
            <h3 style="margin-top: 0; margin-bottom: 14px; font-size: 1.1rem;">Smart Task List</h3>
            <div class="task-input-group">
                <input type="text" id="new-task-input" placeholder="Enter a major task (e.g., Build landing page)...">
                <button onclick="addTask()">Add Task</button>
            </div>
            <ul class="task-list" id="task-list"></ul>
        </div>
    </div>

    <!-- Transformers.js Script Module -->
    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2';

        let generator = null;
        const statusEl = document.getElementById('ai-status');

        function updateStatus(text) {
            statusEl.style.display = 'block';
            statusEl.innerText = text;
        }

        async function initAI() {
            try {
                updateStatus("Loading local browser AI model (Gemma-3 270M)... First time takes ~10s.");
                generator = await pipeline('text-generation', 'onnx-community/gemma-3-270m-it-ONNX', {
                    device: 'webgpu'
                });
                updateStatus("✨ Browser AI Ready
