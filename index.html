<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow AI - Task-Based ToDoozie Assistant</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border: #334155;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            position: relative;
        }

        /* Floating Spotify Widget in Upper Right Corner */
        .spotify-floating-widget {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 300px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .spotify-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 600;
            color: #1db954; /* Spotify Green */
            padding: 0 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .spotify-floating-widget iframe {
            border-radius: 10px;
            width: 100%;
            height: 152px;
            border: none;
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-top: 10px;
        }

        header {
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px 0;
            font-size: 1.8rem;
            color: #818cf8;
        }

        header p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Task Creation Form */
        .task-input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button.secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        button.secondary:hover {
            background-color: var(--border);
        }

        button.timer-btn-active {
            background-color: var(--warning);
            color: #000;
        }

        /* Task Cards List */
        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .task-item {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: border-color 0.2s;
        }

        .task-item.active-timer-card {
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.2);
        }

        .task-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .task-title {
            font-weight: 600;
            font-size: 1.05rem;
            flex: 1;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .status-not-started { background-color: rgba(148, 163, 184, 0.1); color: var(--text-secondary); border-color: var(--border); }
        .status-in-progress { background-color: rgba(245, 158, 11, 0.15); color: var(--warning); border-color: rgba(245, 158, 11, 0.3); }
        .status-done { background-color: rgba(16, 185, 129, 0.15); color: var(--success); border-color: rgba(16, 185, 129, 0.3); text-decoration: line-through; }

        /* Integrated Task Timer Widget */
        .task-timer-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
        }

        .timer-time {
            font-size: 1.4rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: #818cf8;
        }

        .timer-controls-group {
            display: flex;
            gap: 6px;
        }

        .subtasks {
            list-style: disc;
            margin: 4px 0 0 20px;
            padding: 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        #ai-status {
            background-color: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
        }

        /* Mobile Layout Adjustments */
        @media (max-width: 950px) {
            .spotify-floating-widget {
                position: relative;
                top: 0;
                right: 0;
                width: 100%;
                margin-bottom: 20px;
            }
            body {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Spotify Widget -->
    <div class="spotify-floating-widget">
        <div class="spotify-header">
            <span>💚 Focus Playlist</span>
        </div>
        <iframe src="https://open.spotify.com/embed/playlist/0vvXsWCC9xrXsKd4FyS8kM?utm_source=generator&theme=0" 
                frameBorder="0" 
                allowfullscreen="" 
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                loading="lazy">
        </iframe>
    </div>

    <div class="container">
        <header>
            <h1>FocusFlow AI</h1>
            <p>Task-Associated ToDoozie Timers & Local AI Breakdown</p>
        </header>

        <!-- Task Input Card -->
        <div class="card">
            <h3 style="margin-top: 0; margin-bottom: 14px; font-size: 1.1rem;">Add New Focus Goal</h3>
            <div class="task-input-group">
                <input type="text" id="new-task-input" placeholder="Enter a major task (e.g., Draft Q4 Marketing Pitch)...">
                <button onclick="addTask()">Add Task</button>
            </div>
        </div>

        <!-- AI Status banner -->
        <div id="ai-status">Initializing local AI model...</div>

        <!-- Dynamic Task Cards with Built-in Timers -->
        <div class="card">
            <h3 style="margin-top: 0; margin-bottom: 14px; font-size: 1.1rem;">Your Active Tasks</h3>
            <ul class="task-list" id="task-list"></ul>
        </div>
    </div>

    <!-- Transformers.js AI Module -->
    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2';

        let generator = null;
        const statusEl = document.getElementById('ai-status');

        function updateStatus(text) {
            statusEl.style.display = 'block';
            statusEl.innerText = text;
        }

        async function initAI() {
            try {
                updateStatus("Loading local browser AI model (Gemma-3 270M)... First time takes ~10s.");
                generator = await pipeline('text-generation', 'onnx-community/gemma-3-270m-it-ONNX', {
                    device: 'webgpu'
                });
                updateStatus("✨ Browser AI Ready! Click '🤖 AI Breakdown' on any task.");
                setTimeout(() => { statusEl.style.display = 'none'; }, 4000);
            } catch (err) {
                console.warn("WebGPU initialization note, trying WASM fallback...", err);
                try {
                    generator = await pipeline('text-generation', 'onnx-community/gemma-3-270m-it-ONNX', {
                        device: 'wasm'
                    });
                    updateStatus("✨ Browser AI Ready (WASM Mode)! Click '🤖 AI Breakdown'.");
                    setTimeout(() => { statusEl.style.display = 'none'; }, 4000);
                } catch (fallbackErr) {
                    console.error("AI Model load failed entirely:", fallbackErr);
                    updateStatus("⚠️ AI running in smart local fallback mode.");
                    setTimeout(() => { statusEl.style.display = 'none'; }, 4000);
                }
            }
        }

        initAI();

        window.breakdownTaskWithAI = async function(taskId) {
            const task = window.tasks.find(t => t.id === taskId);
            if (!task) return;

            const btn = document.getElementById(`ai-btn-${taskId}`);
            btn.disabled = true;
            btn.innerText = "Thinking...";
            updateStatus(`AI is breaking down: "${task.text}"...`);

            let subtasks = [];
            try {
                if (generator) {
                    const prompt = `Break down this task into 3 short actionable 25-minute ToDoozie steps. Output only a list starting with hyphens:\nTask: ${task.text}\nSteps:\n-`;
                    const output = await generator(prompt, { max_new_tokens: 80, temperature: 0.3 });
                    const generatedText = output[0].generated_text;
                    
                    subtasks = generatedText
                        .split('\n')
                        .filter(line => line.trim().startsWith('-') || line.trim().startsWith('*'))
                        .map(line => line.replace(/^[-*]\s*/, '').trim())
                        .slice(0, 3);
                }
                
                if (subtasks.length === 0) {
                    subtasks = [
                        `Research and outline requirements for ${task.text}`,
                        `Execute core implementation block (25 mins)`,
                        `Review, test, and finalize deliverables`
                    ];
                }
            } catch (e) {
                console.error("Inference error:", e);
                subtasks = [`Define scope and initial setup`, `Deep work sprint session`, `Final cleanup and review`];
            }

            task.subtasks = subtasks;
            saveAndRender();
            statusEl.style.display = 'none';
        }
    </script>

    <!-- Task-Associated ToDoozie Logic & State Persistence -->
    <script>
        window.tasks = JSON.parse(localStorage.getItem('focusflow_tasks')) || [];
        let activeTimerInterval = null;
        let activeTaskId = null;

        function saveAndRender() {
            localStorage.setItem('focusflow_tasks', JSON.stringify(window.tasks));
            renderTasks();
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function renderTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = '';

            if (window.tasks.length === 0) {
                list.innerHTML = `<li style="text-align: center; color: var(--text-secondary); padding: 10px;">No active tasks. Add one above to get started!</li>`;
                return;
            }

            window.tasks.forEach(task => {
                const li = document.createElement('li');
                li.className = `task-item ${task.id === activeTaskId ? 'active-timer-card' : ''}`;
                const statusLabels = { 'not-started': 'Not Started', 'in-progress': 'In Progress', 'done': 'Done' };

                // Ensure task timer defaults to 25 mins (1500 secs)
                if (task.timeLeft === undefined) task.timeLeft = 25 * 60;

                li.innerHTML = `
                    <div class="task-header">
                        <span class="task-title" style="${task.status === 'done' ? 'text-decoration: line-through; color: var(--text-secondary);' : ''}">${task.text}</span>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span class="status-badge status-${task.status}" onclick="cycleStatus(${task.id})" title="Click to change status">${statusLabels[task.status]}</span>
                            <button class="secondary" id="ai-btn-${task.id}" onclick="breakdownTaskWithAI(${task.id})">🤖 AI Breakdown</button>
                            <button class="secondary" onclick="deleteTask(${task.id})" style="color: var(--danger); border-color: rgba(239, 68, 68, 0.3);">×</button>
                        </div>
                    </div>

                    <!-- Individual Task Timer Row -->
                    <div class="task-timer-bar">
                        <div class="timer-time" id="timer-display-${task.id}">${formatTime(task.timeLeft)}</div>
                        <div class="timer-controls-group">
                            <button id="timer-btn-${task.id}" class="${task.id === activeTaskId ? 'timer-btn-active' : 'secondary'}" onclick="toggleTaskTimer(${task.id})">
                                ${task.id === activeTaskId ? 'Pause' : 'Start Focus'}
                            </button>
                            <button class="secondary" onclick="resetTaskTimer(${task.id})">Reset</button>
                        </div>
                    </div>

                    <ul class="subtasks" id="subtasks-${task.id}">
                        ${(task.subtasks || []).map(st => `<li>${st}</li>`).join('')}
                    </ul>
                `;
                list.appendChild(li);
            });
        }

        window.addTask = function() {
            const input = document.getElementById('new-task-input');
            const text = input.value.trim();
            if (!text) return;

            window.tasks.push({
                id: Date.now(),
                text: text,
                status: 'not-started',
                timeLeft: 25 * 60,
                subtasks: []
            });
            input.value = '';
            saveAndRender();
        }

        window.toggleTaskTimer = function(id) {
            const task = window.tasks.find(t => t.id === id);
            if (!task) return;

            // If another task was running, stop it
            if (activeTaskId && activeTaskId !== id) {
                clearInterval(activeTimerInterval);
                activeTimerInterval = null;
            }

            // Toggle pause if clicking the active running task
            if (activeTaskId === id) {
                clearInterval(activeTimerInterval);
                activeTimerInterval = null;
                activeTaskId = null;
                saveAndRender();
                return;
            }

            // Start countdown timer for selected task
            activeTaskId = id;
            if (task.status === 'not-started') task.status = 'in-progress';

            activeTimerInterval = setInterval(() => {
                if (task.timeLeft > 0) {
                    task.timeLeft--;
                    const display = document.getElementById(`timer-display-${task.id}`);
                    if (display) display.textContent = formatTime(task.timeLeft);
                } else {
                    clearInterval(activeTimerInterval);
                    activeTimerInterval = null;
                    activeTaskId = null;
                    task.status = 'done';
                    alert(`🎉 ToDoozie complete for "${task.text}"! Take a break.`);
                    saveAndRender();
                }
            }, 1000);

            saveAndRender();
        }

        window.resetTaskTimer = function(id) {
            if (activeTaskId === id) {
                clearInterval(activeTimerInterval);
                activeTimerInterval = null;
                activeTaskId = null;
            }
            const task = window.tasks.find(t => t.id === id);
            if (task) {
                task.timeLeft = 25 * 60;
            }
            saveAndRender();
        }

        window.cycleStatus = function(id) {
            const task = window.tasks.find(t => t.id === id);
            if (!task) return;

            if (task.status === 'not-started') task.status = 'in-progress';
            else if (task.status === 'in-progress') task.status = 'done';
            else task.status = 'not-started';

            saveAndRender();
        }

        window.deleteTask = function(id) {
            if (activeTaskId === id) {
                clearInterval(activeTimerInterval);
                activeTimerInterval = null;
                activeTaskId = null;
            }
            window.tasks = window.tasks.filter(t => t.id !== id);
            saveAndRender();
        }

        document.getElementById('new-task-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') window.addTask();
        });

        renderTasks();
    </script>
</body>
</html>
