<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow AI - ToDoozie & Task Assistant</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border: #334155;
            --danger: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        header {
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px 0;
            font-size: 1.8rem;
            color: #818cf8;
        }

        header p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* ToDoozie Section */
        .timer-display {
            font-size: 4.5rem;
            font-weight: 800;
            text-align: center;
            letter-spacing: -2px;
            margin: 10px 0;
            font-variant-numeric: tabular-nums;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button.secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        button.secondary:hover {
            background-color: var(--border);
        }

        /* Tasks Section */
        .task-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .task-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .task-title {
            font-weight: 500;
            flex: 1;
        }

        .subtasks {
            list-style: disc;
            margin: 6px 0 0 20px;
            padding: 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* AI Status Bar */
        #ai-status {
            background-color: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>FocusFlow AI</h1>
            <p>ToDoozie Focus Timer & In-Browser AI Task Breakdown</p>
        </header>

        <!-- ToDoozie Timer Card -->
        <div class="card" style="text-align: center;">
            <div id="timer-mode" style="text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; color: var(--text-secondary);">Work Session</div>
            <div class="timer-display" id="timer">25:00</div>
            <div class="timer-controls">
                <button id="start-btn" onclick="toggleTimer()">Start</button>
                <button class="secondary" onclick="resetTimer()">Reset</button>
                <button class="secondary" onclick="switchMode()">Switch Mode</button>
            </div>
        </div>

        <!-- AI Status banner -->
        <div id="ai-status">Initializing local AI model...</div>

        <!-- Tasks Card -->
        <div class="card">
            <h3 style="margin-top: 0; margin-bottom: 14px; font-size: 1.1rem;">Smart Task List</h3>
            <div class="task-input-group">
                <input type="text" id="new-task-input" placeholder="Enter a major task (e.g., Build landing page)...">
                <button onclick="addTask()">Add Task</button>
            </div>
            <ul class="task-list" id="task-list">
                <!-- Dynamic tasks appear here -->
            </ul>
        </div>
    </div>

    <!-- Transformers.js Script Module via CDN -->
    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2';

        let generator = null;
        const statusEl = document.getElementById('ai-status');

        function updateStatus(text) {
            statusEl.style.display = 'block';
            statusEl.innerText = text;
        }

        // Lazy load the local AI model on startup
        async function initAI() {
            try {
                updateStatus("Loading local browser AI model (Gemma-3 270M)... First time takes ~10s.");
                // Using a lightweight, fast ONNX model designed for browser execution
                generator = await pipeline('text-generation', 'onnx-community/gemma-3-270m-it-ONNX', {
                    device: 'webgpu' // Auto falls back to WASM/CPU if WebGPU isn't supported
                });
                updateStatus("✨ Browser AI Ready! Click '🤖 AI Breakdown' on any task.");
                setTimeout(() => { statusEl.style.display = 'none'; }, 4000);
            } catch (err) {
                console.warn("WebGPU/Model load issue, falling back to heuristic parsing mode.", err);
                updateStatus("⚠️ Running in smart-heuristic AI mode.");
                setTimeout(() => { statusEl.style.display = 'none'; }, 4000);
            }
        }

initAI();

        // Expose global AI breakdown function to window scope
        window.breakdownTaskWithAI = async function(taskId, taskText) {
            const btn = document.getElementById(`btn-${taskId}`);
            const subtaskContainer = document.getElementById(`subtasks-${taskId}`);
            
            btn.disabled = true;
            btn.innerText = "Thinking...";
            updateStatus(`AI is breaking down: "${taskText}"...`);

            let subtasks = [];

            try {
                if (generator) {
                    const prompt = `Break down this task into 3 short actionable 25-minute ToDoozie steps. Output only a list starting with hyphens:\nTask: ${taskText}\nSteps:\n-`;
                    const output = await generator(prompt, { max_new_tokens: 80, temperature: 0.3 });
                    const generatedText = output[0].generated_text;
                    
                    // Parse bullet points from text output
                    subtasks = generatedText
                        .split('\n')
                        .filter(line => line.trim().startsWith('-') || line.trim().startsWith('*'))
                        .map(line => line.replace(/^[-*]\s*/, '').trim())
                        .slice(0, 3);
                }
                
                // Fallback if model output is empty
                if (subtasks.length === 0) {
                    subtasks = [
                        `Research and outline requirements for ${taskText}`,
                        `Execute core implementation block (25 mins)`,
                        `Review, test, and finalize deliverables`
                    ];
                }
            } catch (e) {
                console.error("Inference error:", e);
                subtasks = [
                    `Define scope and initial setup for ${taskText}`,
                    `Deep work sprint session`,
                    `Final cleanup and review`
                ];
            }

            // Render subtasks into DOM
            subtaskContainer.innerHTML = '';
            subtasks.forEach(st => {
                const li = document.createElement('li');
                li.innerText = st;
                subtaskContainer.appendChild(li);
            });

            btn.innerText = "Done ✓";
            statusEl.style.display = 'none';
        }
    </script>

    <!-- ToDoozie & UI Script Logic -->
    <script>
        let timeLeft = 25 * 60;
        let timerId = null;
        let isRunning = false;
        let isWorkSession = true;

        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('start-btn');
        const timerMode = document.getElementById('timer-mode');

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerId);
                startBtn.textContent = "Start";
                isRunning = false;
            } else {
                isRunning = true;
                startBtn.textContent = "Pause";
                timerId = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timerId);
                        alert(isWorkSession ? "ToDoozie session complete! Take a break." : "Break over! Time to focus.");
                        switchMode();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerId);
            isRunning = false;
            startBtn.textContent = "Start";
            timeLeft = isWorkSession ? 25 * 60 : 5 * 60;
            updateTimerDisplay();
        }

        function switchMode() {
            clearInterval(timerId);
            isRunning = false;
            startBtn.textContent = "Start";
            isWorkSession = !isWorkSession;
            timeLeft = isWorkSession ? 25 * 60 : 5 * 60;
            timerMode.textContent = isWorkSession ? "Work Session" : "Break Time";
            timerDisplay.style.color = isWorkSession ? "var(--text-primary)" : "#34d399";
            updateTimerDisplay();
        }

        let taskIdCounter = 0;
        function addTask() {
            const input = document.getElementById('new-task-input');
            const text = input.value.trim();
            if (!text) return;

            const id = taskIdCounter++;
            const list = document.getElementById('task-list');

            const li = document.createElement('li');
            li.className = 'task-item';
            li.innerHTML = `
                <div class="task-main">
                    <span class="task-title">${text}</span>
                    <button class="secondary" id="btn-${id}" onclick="breakdownTaskWithAI(${id}, '${text.replace(/'/g, "\\'")}')">🤖 AI Breakdown</button>
                </div>
                <ul class="subtasks" id="subtasks-${id}"></ul>
            `;

            list.appendChild(li);
            input.value = '';
        }

        // Allow pressing 'Enter' to add tasks
        document.getElementById('new-task-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        updateTimerDisplay();
    </script>
</body>
</html>
