<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow AI - ToDoozie & Task Assistant</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border: #334155;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        header {
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px 0;
            font-size: 1.8rem;
            color: #818cf8;
        }

        header p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* ToDoozie Section */
        .timer-display {
            font-size: 4.5rem;
            font-weight: 800;
            text-align: center;
            letter-spacing: -2px;
            margin: 10px 0;
            font-variant-numeric: tabular-nums;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button.secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        button.secondary:hover {
            background-color: var(--border);
        }

        /* Music Generator Control Panel */
        .music-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .music-controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        select {
            background-color: var(--bg-color);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        select:focus {
            border-color: var(--accent);
        }

        /* Tasks Section */
        .task-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .task-title {
            font-weight: 500;
        }

        .task-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .status-not-started { background-color: rgba(148, 163, 184, 0.1); color: var(--text-secondary); border-color: var(--border); }
        .status-in-progress { background-color: rgba(245, 158, 11, 0.15); color: var(--warning); border-color: rgba(245, 158, 11, 0.3); }
        .status-done { background-color: rgba(16, 185, 129, 0.15); color: var(--success); border-color: rgba(16, 185, 129, 0.3); text-decoration: line-through; }

        .subtasks {
            list-style: disc;
            margin: 4px 0 0 20px;
            padding: 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        #ai-status {
            background-color: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>FocusFlow AI</h1>
            <p>ToDoozie Focus Timer & In-Browser AI Task Breakdown</p>
        </header>

        <!-- ToDoozie Timer Card with Modern Soundscape Generator -->
        <div class="card" style="text-align: center;">
            <div id="timer-mode" style="text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; color: var(--text-secondary);">Work Session</div>
            <div class="timer-display" id="timer">25:00</div>
            <div class="timer-controls">
                <button id="start-btn" onclick="toggleTimer()">Start</button>
                <button class="secondary" onclick="resetTimer()">Reset</button>
                <button class="secondary" onclick="switchMode()">Switch Mode</button>
            </div>

            <!-- Modern Soundscape Generator Panel -->
            <div class="music-panel">
                <div style="font-size: 0.85rem; font-weight: 600; color: #a5b4fc; text-align: left;">🎵 Modern Lo-Fi & Synth Soundscapes</div>
                <div class="music-controls-row">
                    <select id="music-style-select" onchange="changeMusicStyle()">
                        <option value="lofi">☕ Lo-Fi Chill Beats (Warm Chords)</option>
                        <option value="synthwave">🌆 Cyberpunk Synthwave (Arpeggios)</option>
                        <option value="ambient">🌌 Deep Theta Ambient (Binaural Drone)</option>
                    </select>
                    <button id="music-toggle-btn" class="secondary" onclick="toggleMusic()">Play Soundscape</button>
                </div>
            </div>
        </div>

        <!-- AI Status banner -->
        <div id="ai-status">Initializing local AI model...</div>

        <!-- Tasks Card -->
        <div class="card">
            <h3 style="margin-top: 0; margin-bottom: 14px; font-size: 1.1rem;">Smart Task List</h3>
            <div class="task-input-group">
                <input type="text" id="new-task-input" placeholder="Enter a major task (e.g., Build landing page)...">
                <button onclick="addTask()">Add Task</button>
            </div>
            <ul class="task-list" id="task-list"></ul>
        </div>
    </div>

    <!-- Transformers.js Script Module -->
    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2';

        let generator = null;
        const statusEl = document.getElementById('ai-status');

        function updateStatus(text) {
            statusEl.style.display = 'block';
            statusEl.innerText = text;
        }

        async function initAI() {
            try {
                updateStatus("Loading local browser AI model (Gemma-3 270M)... First time takes ~10s.");
                generator = await pipeline('text-generation', 'onnx-community/gemma-3-270m-it-ONNX', {
                    device: 'webgpu'
                });
                updateStatus("✨ Browser AI Ready! Click '🤖 AI Breakdown' on any task.");
                setTimeout(() => { statusEl.style.display = 'none'; }, 4000);
            } catch (err) {
                console.warn("WebGPU/Model load issue, falling back to heuristic parsing mode.", err);
                updateStatus("⚠️ Running in smart-heuristic AI mode.");
                setTimeout(() => { statusEl.style.display = 'none'; }, 4000);
            }
        }

        initAI();

        window.breakdownTaskWithAI = async function(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            const btn = document.getElementById(`btn-${taskId}`);
            btn.disabled = true;
            btn.innerText = "Thinking...";
            updateStatus(`AI is breaking down: "${task.text}"...`);

            let subtasks = [];
            try {
                if (generator) {
                    const prompt = `Break down this task into 3 short actionable 25-minute ToDoozie steps. Output only a list starting with hyphens:\nTask: ${task.text}\nSteps:\n-`;
                    const output = await generator(prompt, { max_new_tokens: 80, temperature: 0.3 });
                    const generatedText = output[0].generated_text;
                    
                    subtasks = generatedText
                        .split('\n')
                        .filter(line => line.trim().startsWith('-') || line.trim().startsWith('*'))
                        .map(line => line.replace(/^[-*]\s*/, '').trim())
                        .slice(0, 3);
                }
                
                if (subtasks.length === 0) {
                    subtasks = [
                        `Research and outline requirements for ${task.text}`,
                        `Execute core implementation block (25 mins)`,
                        `Review, test, and finalize deliverables`
                    ];
                }
            } catch (e) {
                console.error("Inference error:", e);
                subtasks = [`Define scope and initial setup`, `Deep work sprint session`, `Final cleanup and review`];
            }

            task.subtasks = subtasks;
            saveAndRender();
            statusEl.style.display = 'none';
        }
    </script>

    <!-- Modern Procedural Web Audio Engine & App Logic -->
    <script>
        let audioCtx = null;
        let isMusicPlaying = false;
        let musicTimer = null;
        let currentStyle = 'lofi';

        // Rich chord progressions (frequencies in Hz for Lo-Fi minor 9th / 11th chord structures)
        const chordProgressions = {
            lofi: [
                [220.00, 261.63, 329.63, 392.00], // Am9
                [174.61, 220.00, 261.63, 329.63], // Fmaj7
                [130.81, 164.81, 196.00, 246.94], // Cmaj7
                [196.00, 246.94, 293.66, 349.23]  // G6
            ],
            synthwave: [
                [146.83, 220.00, 293.66, 440.00], // Dm root octave
                [123.47, 185.00, 246.94, 370.00], // Bm
                [110.00, 164.81, 220.00, 329.63], // Am
                [130.81, 196.00, 261.63, 392.00]  // C
            ],
            ambient: [
                [103.83, 155.56, 207.65, 311.13], // Ab drone pad
                [116.54, 174.61, 233.08, 349.23], // Bb drone pad
                [92.50, 138.59, 185.00, 277.18]   // F# drone pad
            ]
        };

        function toggleMusic() {
            const btn = document.getElementById('music-toggle-btn');
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            isMusicPlaying = !isMusicPlaying;
            if (isMusicPlaying) {
                btn.textContent = "Stop Soundscape";
                btn.style.borderColor = "var(--success)";
                btn.style.color = "var(--success)";
                startModernSoundEngine();
            } else {
                btn.textContent = "Play Soundscape";
                btn.style.borderColor = "var(--border)";
                btn.style.color = "var(--text-primary)";
                stopModernSoundEngine();
            }
        }

        function changeMusicStyle() {
            currentStyle = document.getElementById('music-style-select').value;
        }

        // Play a lush multi-oscillator polyphonic chord with low-pass filtering and slow smooth envelopes
        function playChord(frequencies) {
            if (!audioCtx || !isMusicPlaying) return;

            const now = audioCtx.currentTime;
            
            // Master filter for warm lo-fi atmosphere (removes harsh digital highs)
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(currentStyle === 'synthwave' ? 1800 : 850, now);

            // Master gain to keep overall output safe and balanced
            const masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0, now);
            masterGain.gain.linearRampToValueAtTime(0.12, now + 0.8); // Smooth attack
            masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 4.5); // Long gentle release

            filter.connect(masterGain);
            masterGain.connect(audioCtx.destination);

            // Spawn oscillators for each note in the chord
            frequencies.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                // Use triangle/sine mix for warm vintage synthesizer pad feel
                osc.type = (currentStyle === 'synthwave' && idx % 2 === 0) ? 'sawtooth' : 'triangle';
                osc.frequency.setValueAtTime(freq, now);
                
                // Slight organic detuning for movement
                if (idx > 0) {
                    osc.detune.setValueAtTime((Math.random() - 0.5) * 8, now);
                }

                osc.connect(filter);
                osc.start(now);
                osc.stop(now + 5.0);
            });
        }

        function startModernSoundEngine() {
            stopModernSoundEngine();

            let chordIndex = 0;
            const playLoop = () => {
                if (!isMusicPlaying) return;

                const progression = chordProgressions[currentStyle];
                const currentChord = progression[chordIndex];
                
                playChord(currentChord);

                chordIndex = (chordIndex + 1) % progression.length;

                // Timing interval depending on mood
                const interval = currentStyle === 'synthwave' ? 2400 : 4500;
                musicTimer = setTimeout(playLoop, interval);
            };

            playLoop();
        }

        function stopModernSoundEngine() {
            if (musicTimer) {
                clearTimeout(musicTimer);
                musicTimer = null;
            }
        }

        // ToDoozie & App State Logic
        let timeLeft = 25 * 60;
        let timerId = null;
        let isRunning = false;
        let isWorkSession = true;

        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('start-btn');
        const timerMode = document.getElementById('timer-mode');

        let tasks = JSON.parse(localStorage.getItem('focusflow_tasks')) || [];

        function saveAndRender() {
            localStorage.setItem('focusflow_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function renderTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = '';

            if (tasks.length === 0) {
                list.innerHTML = `<li style="text-align: center; color: var(--text-secondary); padding: 10px;">No tasks added yet. Add one above!</li>`;
                return;
            }

            tasks.forEach(task => {
                const li = document.createElement('li');
                li.className = 'task-item';
                const statusLabels = { 'not-started': 'Not Started', 'in-progress': 'In Progress', 'done': 'Done' };

                li.innerHTML = `
                    <div class="task-main">
                        <div class="task-info">
                            <span class="task-title" style="${task.status === 'done' ? 'text-decoration: line-through; color: var(--text-secondary);' : ''}">${task.text}</span>
                        </div>
                        <div class="task-actions">
                            <span class="status-badge status-${task.status}" onclick="cycleStatus(${task.id})" title="Click to change status">${statusLabels[task.status]}</span>
                            <button class="secondary" id="btn-${task.id}" onclick="breakdownTaskWithAI(${task.id})">🤖 AI Breakdown</button>
                            <button class="secondary" onclick="deleteTask(${task.id})" style="color: var(--danger); border-color: rgba(239, 68, 68, 0.3);">×</button>
                        </div>
                    </div>
                    <ul class="subtasks" id="subtasks-${task.id}">
                        ${(task.subtasks || []).map(st => `<li>${st}</li>`).join('')}
                    </ul>
                `;
                list.appendChild(li);
            });
        }

        function addTask() {
            const input = document.getElementById('new-task-input');
            const text = input.value.trim();
            if (!text) return;

            tasks.push({
                id: Date.now(),
                text: text,
                status: 'not-started',
                subtasks: []
            });
            input.value = '';
            saveAndRender();
        }

        function cycleStatus(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            if (task.status === 'not-started') task.status = 'in-progress';
            else if (task.status === 'in-progress') task.status = 'done';
            else task.status = 'not-started';

            saveAndRender();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveAndRender();
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerId);
                startBtn.textContent = "Start";
                isRunning = false;
            } else {
                isRunning = true;
                startBtn.textContent = "Pause";
                timerId = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timerId);
                        alert(isWorkSession ? "ToDoozie session complete! Take a break." : "Break over! Time to focus.");
                        switchMode();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerId);
            isRunning = false;
            startBtn.textContent = "Start";
            timeLeft = isWorkSession ? 25 * 60 : 5 * 60;
            updateTimerDisplay();
        }

        function switchMode() {
            clearInterval(timerId);
            isRunning = false;
            startBtn.textContent = "Start";
            isWorkSession = !isWorkSession;
            timeLeft = isWorkSession ? 25 * 60 : 5 * 60;
            timerMode.textContent = isWorkSession ? "Work Session" : "Break Time";
            timerDisplay.style.color = isWorkSession ? "var(--text-primary)" : "#34d399";
            updateTimerDisplay();
        }

        document.getElementById('new-task-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        updateTimerDisplay();
        renderTasks();
    </script>
</body>
</html>
